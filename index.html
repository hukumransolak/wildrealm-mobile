*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101a15;color:#f1e2b1;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#world{position:fixed;inset:0}canvas{display:block}.panel{background:#14231dd9;border:1px solid #d9c48a66;backdrop-filter:blur(9px);border-radius:13px;box-shadow:0 7px 20px #0005}.top{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.stats{padding:10px;width:min(280px,68vw)}.brand{font-weight:900;font-size:13px;letter-spacing:1.5px}.sub{font-size:11px;color:#c9c6a6}.bar{height:7px;background:#3c4336;border-radius:9px;overflow:hidden;margin:4px 0}.fill{height:100%;background:#b95043;width:100%}.xp{background:#d6b94e}.right{padding:10px;text-align:right;font-size:12px}.quest{position:fixed;top:108px;left:10px;padding:10px;width:min(260px,62vw);pointer-events:none;font-size:12px}.quest b{color:#f0d995;font-size:11px}.map{position:fixed;top:110px;right:10px;width:100px;height:100px;border-radius:50%;overflow:hidden;border:2px solid #d9c48a88}.map canvas{width:100%;height:100%}.bottom{position:fixed;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}.joy{width:125px;height:125px;position:relative;pointer-events:auto;flex-shrink:0}.jb{position:absolute;inset:7px;border:1px solid #ffffff55;border-radius:50%;background:#15231bbd}.jn{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:#d6d0a9cc;border:1px solid #fff}.actions{display:grid;grid-template-columns:repeat(3,minmax(58px,72px));gap:6px;pointer-events:auto}.btn{min-height:54px;border:1px solid #d9c48a88;border-radius:12px;background:linear-gradient(145deg,#3b523e,#17231c);color:#f9e8b7;font-weight:800;font-size:10px;touch-action:manipulation}.btn strong{display:block;font-size:18px}.toast{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);padding:12px 17px;max-width:85vw;text-align:center;font-weight:700;font-size:13px;display:none}.menu{position:fixed;left:10px;bottom:145px;display:flex;gap:5px;pointer-events:auto}.mini{padding:7px 9px;border-radius:9px;background:#17271ee8;color:#f5e5b3;border:1px solid #d9c48a77;font-weight:800;font-size:11px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}.box{width:min(420px,100%);padding:16px;background:#17251c;border:1px solid #d9c48a77;border-radius:16px;max-height:75vh;overflow:auto}.box h2{margin:0 0 10px}.box p{font-size:13px;line-height:1.5}.box button{padding:9px 12px;border-radius:9px;background:#314833;color:#f5e5b3;border:1px solid #d9c48a77;margin:4px}.hint{position:fixed;bottom:145px;left:50%;transform:translateX(-50%);font-size:10px;background:#17251cbb;padding:6px 10px;border-radius:8px;white-space:nowrap;pointer-events:none}@media(min-width:800px){.joy{display:none}.actions{grid-template-columns:repeat(3,82px)}.btn{min-height:60px}.hint{bottom:85px}}
</style></head><body><div id="world"></div><div class="top"><div class="panel stats"><div class="brand">WILDREALM ✦ <span id="lvl">SEVİYE 1</span></div><div style="font-size:12px;margin-top:5px">KÜL YOLCUSU · ORK SAVAŞÇI</div><div class="bar"><div id="hpbar" class="fill"></div></div><div class="sub">CAN <span id="hp">120/120</span> · <span id="combat">SAVAŞA HAZIR</span></div><div class="bar"><div id="xpbar" class="fill xp" style="width:0%"></div></div><div class="sub">DENEYİM <span id="xp">0/100</span></div></div><div class="panel right"><b>KIZIL VADİ</b><br>◈ <span id="gold">0</span> ALTIN<br><span class="sub">Av: <span id="kills">0</span>/5</span></div></div><div class="panel quest"><b>ANA GÖREV · KÜL VE ÇELİK</b><div id="quest" style="margin-top:5px">Thrak için 5 yaban domuzunu alt et.</div><div class="sub" style="margin-top:5px">Hedef: Yaban domuzu</div></div><div class="map"><canvas id="map" width="180" height="180"></canvas></div><div class="menu"><button class="mini" id="bag">🎒 ÇANTA</button><button class="mini" id="journal">📜 GÖREVLER</button><button class="mini" id="savebtn">💾 KAYDET</button></div><div class="bottom"><div class="joy" id="joy"><div class="jb"></div><div class="jn" id="nub"></div></div><div class="actions"><button class="btn" id="attack"><strong>⚔️</strong>SALDIR</button><button class="btn" id="dash"><strong>➤</strong>ATILMA</button><button class="btn" id="potion"><strong>🧪</strong>İKSİR <span id="pots">3</span></button></div></div><div class="hint" id="hint">Joystick: hareket · Ekranı sürükle: kamera · Yaklaş ve saldır</div><div class="panel toast" id="toast"></div><div class="modal" id="modal"><div class="box"><h2 id="mtitle">Çanta</h2><div id="mbody"></div><button id="close">KAPAT</button></div></div>

const $=id=>document.getElementById(id),host=$('world'),scene=new THREE.Scene();scene.background=new THREE.Color(0x9ab8bd);scene.fog=new THREE.Fog(0x9ab8bd,38,145);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,240),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.13;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf4dc,0x51543c,2));let sun=new THREE.DirectionalLight(0xffe2af,2.8);sun.position.set(-24,36,20);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const M=(c,r=.88)=>new THREE.MeshStandardMaterial({color:c,roughness:r}),grass=M(0x73894d),roadmat=M(0xb4a278),bark=M(0x57422d),leaves=[M(0x2e5937),M(0x426d3e),M(0x587b43)],rockmat=M(0x747a6a),skin=M(0x7ba04e),armor=M(0x344a3b,.55),iron=M(0xa6a68d,.4),tusk=M(0xe8d7a2),boarmat=M(0x684634),goldmat=M(0xe4c35d),dark=M(0x24271f);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);let road=new THREE.Mesh(new THREE.PlaneGeometry(10,135),roadmat);road.rotation.x=-Math.PI/2;road.rotation.z=-.13;road.position.set(0,.02,-34);scene.add(road);
function tree(x,z,s){let g=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.2*s,.38*s,2.7*s,7),bark);tr.position.y=1.35*s;tr.castShadow=true;g.add(tr);for(let i=0;i<3;i++){let c=new THREE.Mesh(new THREE.ConeGeometry((1.8-i*.28)*s,2.45*s,7),leaves[(i+Math.floor(Math.random()*3))%3]);c.position.y=(2.25+i*.95)*s;c.castShadow=true;g.add(c)}g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<115;i++){let x=(Math.random()-.5)*155,z=(Math.random()-.5)*155;if(Math.abs(x)<9&&z<18&&z>-75)continue;tree(x,z,.55+Math.random()*.9)}
for(let i=0;i<35;i++){let r=.5+Math.random()*1.7,o=new THREE.Mesh(new THREE.DodecahedronGeometry(r),rockmat);o.position.set((Math.random()-.5)*140,r*.4,(Math.random()-.5)*140);o.rotation.set(Math.random(),Math.random(),Math.random());o.castShadow=true;scene.add(o)}
function buildOrc(){let g=new THREE.Group();function box(w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}function ball(r,m,x,y,z){let o=new THREE.Mesh(new THREE.SphereGeometry(r,12,10),m);o.position.set(x,y,z);o.castShadow=true;g.add(o);return o}box(.72,.8,.43,armor,0,1.15,0);box(.5,.15,.47,iron,0,1.52,0);ball(.36,skin,0,1.85,0);box(.48,.12,.14,dark,0,1.76,.3);for(let s of [-1,1]){let t=new THREE.Mesh(new THREE.ConeGeometry(.07,.24,6),tusk);t.position.set(s*.2,1.62,.29);t.rotation.x=.25;g.add(t);box(.23,.6,.24,armor,s*.49,1.15,0);box(.19,.53,.2,skin,s*.49,.52,0);box(.24,.17,.28,dark,s*.18,.12,0);let sh=new THREE.Mesh(new THREE.DodecahedronGeometry(.23),iron);sh.position.set(s*.49,1.52,0);sh.castShadow=true;g.add(sh)}let haft=box(.07,1.2,.07,bark,.75,1.05,.1);haft.rotation.z=-.18;let blade=new THREE.Mesh(new THREE.ConeGeometry(.29,.5,4),iron);blade.position.set(.86,1.52,.1);blade.rotation.z=Math.PI/2;g.add(blade);return g}
const player=buildOrc();player.position.set(0,0,8);scene.add(player);
function npc(x,z,name,color){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.CapsuleGeometry(.37,.72,4,8),M(color)),h=new THREE.Mesh(new THREE.SphereGeometry(.27,12,10),skin);b.position.y=.8;h.position.y=1.45;g.add(b,h);g.position.set(x,0,z);scene.add(g);let el=document.createElement('div');el.textContent=name;el.style.cssText='position:fixed;color:#f6e5a9;font:800 12px system-ui;text-shadow:0 2px 4px #000;pointer-events:none';document.body.appendChild(el);return{g,label:el,name}}
const thrak=npc(-2,0,'THRAK',0x806744),runa=npc(4,-5,'RUNA',0x456a75),elder=npc(-10,-22,'YAŞLI ELDRA',0x7a5e84);
function boar(x,z,strong=false){let g=new THREE.Group(),sc=strong?1.3:1;function ell(rx,ry,rz,m,x,y,z){let o=new THREE.Mesh(new THREE.SphereGeometry(1,12,9),m);o.scale.set(rx,ry,rz);o.position.set(x,y,z);o.castShadow=true;g.add(o)}ell(.8*sc,.5*sc,.48*sc,boarmat,0,.58*sc,0);ell(.34*sc,.31*sc,.31*sc,boarmat,.64*sc,.65*sc,.02);ell(.17*sc,.12*sc,.18*sc,dark,.83*sc,.56*sc,.2);for(let s of [-1,1]){let t=new THREE.Mesh(new THREE.ConeGeometry(.08*sc,.25*sc,6),tusk);t.position.set(.66*sc,.44*sc,s*.2*sc);t.rotation.z=-.3;g.add(t)}for(let s of [-1,1])for(let z0 of [-.25,.25]){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.06,.09,.33,6),dark);leg.position.set(-.25*sc,.25*sc,z0*sc);g.add(leg)}g.position.set(x,0,z);scene.add(g);return{g,hp:strong?90:55,max:strong?90:55,alive:true,cool:Math.random(),strong}}
let mobs=[];for(let i=0;i<14;i++){let a=Math.random()*Math.PI*2,r=13+Math.random()*34;mobs.push(boar(Math.cos(a)*r,Math.sin(a)*r-12,i>10))}
let state={hp:120,max:120,xp:0,lvl:1,gold:0,kills:0,potions:3,done:false,sideDone:false,bag:[],attackCd:0,dashCd:0,invuln:0};try{let s=JSON.parse(localStorage.getItem('wildrealm-build1'));if(s&&s.v===1){Object.assign(state,s.state);player.position.set(s.pos.x,0,s.pos.z)}}catch{}
let timer;function toast(t){let e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(timer);timer=setTimeout(()=>e.style.display='none',2200)}function save(){try{localStorage.setItem('wildrealm-build1',JSON.stringify({v:1,state,pos:{x:player.position.x,z:player.position.z}}))}catch{}}
function hud(){$('hp').textContent=Math.ceil(state.hp)+'/'+state.max;$('hpbar').style.width=state.hp/state.max*100+'%';$('xp').textContent=state.xp+'/'+state.lvl*100;$('xpbar').style.width=state.xp/(state.lvl*100)*100+'%';$('lvl').textContent='SEVİYE '+state.lvl;$('gold').textContent=state.gold;$('kills').textContent=state.kills;$('pots').textContent=state.potions;$('quest').textContent=state.done?(state.sideDone?'Kül ve Çelik tamamlandı. Vadide keşfe devam et.':'Ana görev tamamlandı! Yaşlı Eldra ile konuş.'):('Thrak için 5 yaban domuzunu alt et. ('+Math.min(5,state.kills)+'/5)')}
function level(){while(state.xp>=state.lvl*100){state.xp-=state.lvl*100;state.lvl++;state.max+=20;state.hp=state.max;toast('SEVİYE ATLADIN! Seviye '+state.lvl)}}
function attack(){if(state.attackCd>0)return;state.attackCd=.55;let m=mobs.filter(x=>x.alive).sort((a,b)=>a.g.position.distanceTo(player.position)-b.g.position.distanceTo(player.position))[0];if(!m||m.g.position.distanceTo(player.position)>3.5){toast('Hedef menzil dışında. Yaklaş!');return}m.hp-=state.lvl>=3?40:30;if(m.hp<=0){m.alive=false;scene.remove(m.g);state.kills++;state.xp+=m.strong?55:35;state.gold+=m.strong?10:5;state.bag.push(m.strong?'İri Domuz Dişi':'Yaban Domuzu Postu');toast('Düşman alt edildi! Ganimet toplandı.');if(state.kills>=5&&!state.done){state.done=true;state.xp+=75;state.gold+=25;state.bag.push('Thrak’ın Mührü');toast('GÖREV TAMAMLANDI! +75 XP · +25 altın')}level();setTimeout(()=>{let a=Math.random()*6.28,r=16+Math.random()*36;m.g.position.set(Math.cos(a)*r,0,Math.sin(a)*r-12);m.hp=m.max;m.alive=true;scene.add(m.g)},7000);save();hud()}else toast('Vuruş! '+m.hp+' can kaldı.')}
let yaw=0,camYaw=0,camPitch=.22;function dash(){if(state.dashCd>0)return;state.dashCd=2;player.position.x+=Math.sin(yaw)*4;player.position.z+=Math.cos(yaw)*4;state.invuln=.4;toast('Atılma!')}function potion(){if(!state.potions||state.hp===state.max){toast(state.potions?'Canın zaten dolu.':'İksir kalmadı.');return}state.potions--;state.hp=Math.min(state.max,state.hp+50);hud();save();toast('+50 can yenilendi.')}
function talk(){let n=[thrak,runa,elder].sort((a,b)=>a.g.position.distanceTo(player.position)-b.g.position.distanceTo(player.position))[0];if(n.g.position.distanceTo(player.position)>5){toast('Konuşmak için NPC’ye yaklaş.');return}if(n===thrak){if(state.kills>=5){state.done=true;state.gold+=10;toast('Thrak: Vadiyi korudun! +10 altın.')}else toast('Thrak: Beş domuzu avla, kampı koru!')}else if(n===runa)toast('Runa: Kuzey patikasında iri domuzlar ve eski taşlar var.');else if(!state.done)toast('Eldra: Önce Thrak’ın kampını kurtar.');else if(!state.sideDone){state.sideDone=true;state.xp+=60;state.gold+=15;state.bag.push('Eldra’nın Eski Tılsımı');level();toast('YAN GÖREV TAMAMLANDI! +60 XP, +15 altın')}else toast('Eldra: Tılsım yolunu aydınlatsın.');hud();save()}
$('attack').onclick=attack;$('dash').onclick=dash;$('potion').onclick=potion;$('savebtn').onclick=()=>{save();toast('Oyun kaydedildi.')};
let keys={},joy={x:0,y:0},jd=null;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();attack()}if(e.key==='Shift')dash();if(e.key.toLowerCase()==='e')talk();if(e.key.toLowerCase()==='i')inventory()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const ja=$('joy'),nub=$('nub');function joyMove(e){let r=ja.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),lim=38;if(l>lim){dx=dx/l*lim;dy=dy/l*lim}joy.x=dx/lim;joy.y=dy/lim;nub.style.transform=`translate(${dx}px,${dy}px)`}ja.addEventListener('pointerdown',e=>{jd=e.pointerId;ja.setPointerCapture(jd);joyMove(e)});ja.addEventListener('pointermove',e=>{if(jd===e.pointerId)joyMove(e)});function joyEnd(){jd=null;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}ja.addEventListener('pointerup',joyEnd);ja.addEventListener('pointercancel',joyEnd);
let cd=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{cd=e.pointerId;lx=e.clientX;ly=e.clientY;renderer.domElement.setPointerCapture(cd)});renderer.domElement.addEventListener('pointermove',e=>{if(cd!==e.pointerId)return;camYaw-=(e.clientX-lx)*.006;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-ly)*.003,-.05,.65);lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',()=>cd=null);renderer.domElement.addEventListener('pointercancel',()=>cd=null);
function showModal(title,body){$('mtitle').textContent=title;$('mbody').innerHTML=body;$('modal').style.display='flex'}function inventory(){showModal('🎒 Çanta',`<p><b>Silah:</b> Paslı Savaş Baltası<br><b>Zırh:</b> Deri Zırh<br><b>Altın:</b> ${state.gold}<br><b>İksir:</b> ${state.potions}</p>${state.bag.length?state.bag.map(i=>'<span style="display:inline-block;background:#293b2c;padding:8px;margin:3px;border-radius:7px">'+i+'</span>').join(''):'<p>Ganimet yok. Düşmanları yen!</p>'}<p>Ganimetler prototipte koleksiyon öğesidir.</p>`)}$('bag').onclick=inventory;$('journal').onclick=()=>showModal('📜 Görev Günlüğü',`<p><b>Kül ve Çelik:</b> ${state.done?'Tamamlandı':' '+Math.min(5,state.kills)+'/5 yaban domuzu'}</p><p><b>Kayıp Tılsım:</b> ${state.sideDone?'Tamamlandı':state.done?'Yaşlı Eldra ile konuş':'Önce ana görevi tamamla'}</p><p>Runa ile konuş ve vadinin patikalarını keşfet.</p>`);$('close').onclick=()=>$('modal').style.display='none';$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').style.display='none'};
const mc=$('map').getContext('2d');function minimap(){mc.fillStyle='#2a4530';mc.fillRect(0,0,180,180);mc.strokeStyle='#b7a47b';mc.lineWidth=9;mc.beginPath();mc.moveTo(90,180);mc.lineTo(82,90);mc.lineTo(96,0);mc.stroke();for(let m of mobs)if(m.alive){mc.fillStyle=m.strong?'#ef6945':'#c28c55';mc.beginPath();mc.arc(90+(m.g.position.x-player.position.x)*1.1,90+(m.g.position.z-player.position.z)*1.1,3,0,7);mc.fill()}mc.fillStyle='#f3e4a7';mc.beginPath();mc.arc(90,90,4,0,7);mc.fill();for(let n of [thrak,runa,elder]){mc.fillStyle='#e8c768';mc.fillRect(90+(n.g.position.x-player.position.x)*1.1-2,90+(n.g.position.z-player.position.z)*1.1-2,5,5)}}
let last=performance.now(),saveTime=0;function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;state.attackCd=Math.max(0,state.attackCd-dt);state.dashCd=Math.max(0,state.dashCd-dt);state.invuln=Math.max(0,state.invuln-dt);
let f=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0)-joy.y,side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,v=new THREE.Vector2(side,f);if(v.length()>1)v.normalize();if(v.lengthSq()>.01){let ca=Math.cos(camYaw),sa=Math.sin(camYaw),wx=v.x*ca+v.y*sa,wz=-v.x*sa+v.y*ca;player.position.x+=wx*8*dt;player.position.z+=wz*8*dt;yaw=Math.atan2(wx,wz);player.rotation.y=yaw;player.position.y=Math.abs(Math.sin(now*.012))*.035}
player.position.x=THREE.MathUtils.clamp(player.position.x,-85,85);player.position.z=THREE.MathUtils.clamp(player.position.z,-85,85);
for(let m of mobs){if(!m.alive)continue;let d=m.g.position.distanceTo(player.position);m.cool-=dt;if(d<8&&d>1.6){let dir=player.position.clone().sub(m.g.position).normalize();m.g.position.addScaledVector(dir,1.5*dt);m.g.rotation.y=Math.atan2(dir.x,dir.z)}if(d<1.7&&m.cool<=0){m.cool=1.4;if(state.invuln<=0){state.hp-=m.strong?11:7;if(state.hp<=0){state.hp=state.max;player.position.set(0,0,8);toast('Yere düştün. Kampta yeniden doğdun.')}hud()}}}
let cp=Math.cos(camPitch),sp=Math.sin(camPitch),dist=10,desired=new THREE.Vector3(player.position.x+Math.sin(camYaw)*dist*cp,player.position.y+3+dist*sp,player.position.z+Math.cos(camYaw)*dist*cp);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.1,player.position.z);
for(let n of [thrak,runa,elder]){let p=n.g.position.clone();p.y+=2;p.project(camera);n.label.style.left=((p.x*.5+.5)*innerWidth)+'px';n.label.style.top=((-p.y*.5+.5)*innerHeight)+'px';n.label.style.display=p.z<1?'block':'none'}
if(now-saveTime>5000){save();saveTime=now}minimap();renderer.render(scene,camera)}
requestAnimationFrame(animate);hud();$('hint').textContent=innerWidth<800?'Sol joystick: hareket · Ekranı sürükle: kamera':'WASD: hareket · Sürükle: kamera · Space: saldır · E: konuş';addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
